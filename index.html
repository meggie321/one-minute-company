<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>一分钟公司</title>
<style>
:root{--ink:#2b2b2b;--paper:#fdf6e3;--yellow:#ffe066;--pink:#ffb3ba;--blue:#a8d8ea;--red:#e63946;--green:#2a9d8f;--orange:#f4a261}
*{box-sizing:border-box}body{margin:0;background:repeating-linear-gradient(0deg,var(--paper) 0,var(--paper) 31px,#eadfca 32px);color:var(--ink);font-family:"Trebuchet MS","Microsoft YaHei",sans-serif;min-height:100vh;overflow:hidden}#wrap{max-width:980px;margin:auto;height:100vh;display:flex;flex-direction:column;padding:14px 16px 16px}.title{font-size:clamp(22px,4vw,36px);font-weight:900;transform:rotate(-1deg);margin:0 0 8px;text-shadow:2px 2px 0 #fff}.sub{font-size:12px;font-weight:700;opacity:.65;margin-left:4px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0}.stat{padding:10px 12px;background:var(--yellow);box-shadow:4px 5px 0 #d5bf6a;transform:rotate(-.8deg);border:2px solid var(--ink);border-radius:6px 10px 5px 9px}.stat:nth-child(2){background:var(--green);color:#fff;transform:rotate(1deg)}.stat:nth-child(3){background:var(--pink);transform:rotate(-1.2deg)}.stat:nth-child(4){background:var(--blue);transform:rotate(.8deg)}.stat b{display:block;font-size:clamp(18px,3vw,28px);line-height:1}.stat small{font-weight:900}.bar{height:9px;background:#fff;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;width:70%;background:var(--orange);transition:width .2s}.stage{position:relative;flex:1;min-height:330px;margin:8px 0;display:flex;align-items:center;justify-content:center}.canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}.note{position:relative;z-index:1;width:min(520px,84%);padding:24px 28px 20px;background:var(--yellow);border:3px solid var(--ink);box-shadow:8px 9px 0 rgba(43,43,43,.22);transform:rotate(-1.5deg);border-radius:3px 11px 5px 8px;text-align:center}.pin{position:absolute;top:-13px;left:50%;width:22px;height:22px;border:3px solid var(--ink);border-radius:50%;background:var(--red);transform:translateX(-50%);box-shadow:2px 2px 0 #8c2028}.note h2{font-size:clamp(22px,4vw,34px);margin:2px 0 12px}.note p{font-size:clamp(16px,2.7vw,22px);font-weight:900;margin:0 0 7px}.impact{font-size:13px;font-weight:700;opacity:.7}.timer{position:absolute;top:8px;right:12px;font-weight:900;font-size:20px;transform:rotate(3deg);z-index:2}.queue{position:absolute;left:4%;bottom:10%;background:var(--blue);padding:12px 16px;border:2px solid var(--ink);box-shadow:4px 4px 0 rgba(43,43,43,.18);transform:rotate(-5deg);font-weight:900;max-width:180px}.queue span{display:block;font-size:12px;opacity:.65}.faces{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);font-size:clamp(22px,4vw,32px);white-space:nowrap;letter-spacing:3px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{font:900 clamp(22px,5vw,36px) inherit;padding:18px 10px;border:3px solid var(--ink);border-radius:8px 12px 7px 11px;box-shadow:6px 7px 0 var(--ink);cursor:pointer;touch-action:manipulation;transition:transform .08s,box-shadow .08s}.btn:active{transform:translate(4px,4px);box-shadow:2px 3px 0 var(--ink)}#yes{background:var(--green);color:#fff;transform:rotate(-1deg)}#no{background:var(--pink);transform:rotate(1deg)}.hint{text-align:center;font-size:12px;font-weight:700;opacity:.65;margin-top:8px}.overlay{position:fixed;inset:0;background:rgba(43,43,43,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}.panel{background:var(--paper);border:3px solid var(--ink);box-shadow:9px 10px 0 var(--ink);padding:28px;max-width:480px;width:100%;text-align:center;transform:rotate(-1deg)}.panel h1{margin:0 0 10px;font-size:36px}.panel p{font-weight:700;line-height:1.6}.panel button{background:var(--yellow);font:900 22px inherit;padding:13px 26px;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer}.hidden{display:none!important}.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}@media(max-width:560px){#wrap{padding:10px}.stats{gap:5px}.stat{padding:8px 6px}.stage{min-height:300px}.queue{left:0;bottom:15%}.note{padding:20px 16px}.actions{gap:8px}.btn{padding:16px 6px}}
</style></head>
<body><div id="wrap"><h1 class="title">《一分钟公司》 <span class="sub">办公室涂鸦经营战</span></h1><div class="stats"><div class="stat"><small>⏱ 时间</small><b id="time">60</b></div><div class="stat"><small>💰 现金</small><b id="cash">5000</b></div><div class="stat"><small>😊 士气</small><b id="moraleText">70%</b><div class="bar"><i id="moraleBar"></i></div></div><div class="stat"><small>📊 进度 · <span id="week">1</span>周</small><b id="progress">0%</b></div></div><main class="stage" id="stage"><canvas id="canvas"></canvas><div class="timer" id="decision">2.8s</div><div class="queue" id="queue"><span>下一个请求</span>正在路上…</div><div class="note" id="note"><div class="pin"></div><h2 id="requestTitle">准备开会！</h2><p id="requestBody">你的公司，等你拍板</p><div class="impact" id="impact">← 批准 · 拒绝 →</div></div><div class="faces" id="faces">😊 😊 😐 😟 😫</div></main><div class="actions"><button class="btn" id="yes">← 批准</button><button class="btn" id="no">拒绝 →</button></div><div class="hint">每个请求只有几秒 · 超时会自动批准 · 键盘 ← / → 也能玩</div></div><div class="overlay" id="overlay"><div class="panel"><h1>一分钟公司</h1><p>你是老板。请求会飞进来，60 秒内做出决定。<br>批错不会立刻死，但公司会慢慢崩。</p><button id="start">开始营业</button></div></div><div class="overlay hidden" id="end"><div class="panel"><h1 id="endTitle">公司收工</h1><p id="summary"></p><button id="restart">再来一局</button></div></div>
<script>
const $=id=>document.getElementById(id), cvs=$('canvas'),ctx=cvs.getContext('2d');let state,raf,audio;
const requests=[{t:'老板，我想涨薪',b:'+500 / 月',a:{cash:-500,morale:10},r:{morale:-15},tag:'留住人才'}, {t:'我想请假一天',b:'休息一下',a:{morale:5,progress:-5},r:{morale:-10},tag:'人不是机器'}, {t:'买新设备',b:'-2000 元',a:{cash:-2000,progress:20},r:{progress:-5},tag:'效率 +20'}, {t:'今晚加班？',b:'冲刺进度',a:{morale:-10,progress:15},r:{morale:5,progress:-10},tag:'小心燃尽'}, {t:'周五团建',b:'-1000 元',a:{cash:-1000,morale:20},r:{morale:-15},tag:'一起吃饭'}, {t:'竞品来挖人了',b:'给他加薪留人',a:{cash:-800,morale:8},r:{morale:-18,employees:-1},tag:'危机处理'}, {t:'客户投诉',b:'赔偿 800 元',a:{cash:-800,morale:3,progress:8},r:{cash:-300,progress:-12},tag:'保住口碑'}];
function sound(type){try{audio??=new AudioContext();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);let f=type==='ok'?[660,880]:type==='no'?[180,120]:type==='warn'?[440,330]:[520,620];o.frequency.value=f[0];g.gain.value=.045;o.start();o.frequency.exponentialRampToValueAtTime(f[1],audio.currentTime+.12);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.16);o.stop(audio.currentTime+.17)}catch(e){}}
function resize(){cvs.width=cvs.clientWidth*devicePixelRatio;cvs.height=cvs.clientHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function start(){state={time:60,cash:5000,morale:70,progress:0,employees:5,week:1,current:null,next:null,deadline:0,ended:false,decisions:0};$('overlay').classList.add('hidden');$('end').classList.add('hidden');nextReq();last=performance.now();raf=requestAnimationFrame(loop)}
function nextReq(){state.current=state.next||requests[Math.floor(Math.random()*requests.length)];state.next=requests[Math.floor(Math.random()*requests.length)];state.deadline=performance.now()+2800-Math.min(900,state.week*120);renderReq();sound('fly')}
function renderReq(){$('requestTitle').textContent=state.current.t;$('requestBody').textContent=state.current.b;$('impact').textContent=state.current.tag;$('queue').innerHTML='<span>下一个请求</span>'+state.next.t;$('decision').textContent=((state.deadline-performance.now())/1000).toFixed(1)+'s'}
function decide(approve,timeout=false){if(!state.current||state.ended)return;let d=approve?state.current.a:state.current.r;for(let k in d)state[k]=Math.max(k==='morale'?0:k==='employees'?0:0,state[k]+d[k]);state.decisions++;sound(timeout?'warn':approve?'ok':'no');$('stage').classList.remove('shake');void $('stage').offsetWidth;$('stage').classList.add('shake');if(state.progress>=100){state.progress-=100;state.week++;state.employees+=2;state.cash+=2000;sound('ok')}if(state.cash<=0||state.morale<=0||state.employees<=0){end(state.cash<=0?'破产了':state.morale<=0?'大家都辞职了':'公司没人了');return}nextReq()}
function end(reason){state.ended=true;cancelAnimationFrame(raf);$('endTitle').textContent=reason;$('summary').innerHTML='存活 <b>'+Math.max(0,Math.round(60-state.time))+' 秒</b> · 现金 <b>'+state.cash+'</b> · 士气 <b>'+state.morale+'%</b> · 员工 <b>'+state.employees+' 人</b><br>本局决策 '+state.decisions+' 次 · 评级 <b>'+grade()+'</b>';$('end').classList.remove('hidden');sound('end')}
function grade(){let s=state.cash+state.morale*40+state.employees*300+state.progress*10;return s>9500?'S':s>7500?'A':s>5200?'B':s>3000?'C':'D'}
let last=0;function loop(now){let dt=(now-last)/1000;last=now;state.time-=dt;if(state.time<=0){state.time=0;end('60 秒到了！')}else if(now>state.deadline)decide(true,true);updateUI();draw(now);if(!state.ended)raf=requestAnimationFrame(loop)}
function updateUI(){$('time').textContent=Math.ceil(state.time);$('cash').textContent=state.cash;$('moraleText').textContent=state.morale+'%';$('moraleBar').style.width=state.morale+'%';$('progress').textContent=state.progress+'%';$('week').textContent=state.week;$('faces').textContent=state.morale>80?'😄 😄 😄 🙂 😎':state.morale>55?'😊 😊 😐 🙂 😟':state.morale>30?'😐 😟 😟 😫 😫':'😫 😫 😡 💀 💀';if(state.current)$('decision').textContent=Math.max(0,(state.deadline-performance.now())/1000).toFixed(1)+'s'}
function draw(now){let w=cvs.clientWidth,h=cvs.clientHeight;ctx.clearRect(0,0,w,h);ctx.strokeStyle='rgba(43,43,43,.12)';ctx.lineWidth=2;for(let x=20;x<w;x+=48){ctx.beginPath();ctx.moveTo(x,h-30);ctx.lineTo(x+25,h-55);ctx.stroke()}ctx.fillStyle='rgba(255,224,102,.55)';ctx.beginPath();ctx.arc(w*.18,h*.3,25+Math.sin(now/400)*3,0,7);ctx.fill();ctx.fillStyle='rgba(255,179,186,.55)';ctx.beginPath();ctx.arc(w*.82,h*.55,20+Math.cos(now/500)*4,0,7);ctx.fill()}
$('start').onclick=start;$('restart').onclick=start;$('yes').onclick=()=>decide(true);$('no').onclick=()=>decide(false);addEventListener('keydown',e=>{if(e.key==='ArrowLeft')decide(true);if(e.key==='ArrowRight')decide(false);if(e.key==='Enter'&& !$('overlay').classList.contains('hidden'))start()});
</script></body></html>
